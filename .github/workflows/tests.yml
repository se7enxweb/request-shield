name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'      # nightly: every leg, and the determinism check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which legs this event runs (0031 E.4): a pull request 3, a push to main 14,
  # nightly and by hand all 24. build/ci-plan.php decides; tests/CiPlanTest.php
  # holds it to those numbers.
  plan:
    name: Plan the legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - id: plan
        run: echo "matrix=$(php build/ci-plan.php '${{ github.event_name }}')" >> "$GITHUB_OUTPUT"

  tests:
    name: PHP ${{ matrix.php }}${{ matrix.apcu && ' + APCu' || ' (file store)' }}${{ matrix.entry == 'single' && ', single file' || '' }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.apcu && 'apcu, pcntl' || 'pcntl, :apcu' }}
          ini-values: ${{ matrix.apcu && 'apc.enable_cli=1, opcache.enable_cli=1, opcache.file_update_protection=0' || 'opcache.enable_cli=1, opcache.file_update_protection=0' }}
          coverage: none
          tools: composer

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ALTCHA's widget for its test (tests/AltchaWidgetTest.php)
        # The npm package as published, pinned and unpacked (npm pack runs no scripts): the test runs
        # the widget's own code against the shield's task. Not a dependency of the library.
        run: |
          cd "$RUNNER_TEMP"
          npm pack altcha@3.3.0 --silent
          tar xzf altcha-3.3.0.tgz
          echo "ALTCHA_WIDGET=$RUNNER_TEMP/package" >> "$GITHUB_ENV"

      - name: Syntax check (PHP ${{ matrix.php }})
        run: find src plugins tests bench build config examples bootstrap.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: The single file builds, and PHP ${{ matrix.php }} reads it
        run: |
          php build/single-file.php --build=ci
          php build/single-file.php --edition=stats --build=ci
          php build/single-file.php --edition=api --build=ci
          php build/single-file.php --edition=cache --build=ci
          php build/single-file.php --edition=waf --build=ci
          php -l build/out/request-shield.php > /dev/null
          php -l build/out/request-shield-stats.php > /dev/null
          php -l build/out/request-shield-api.php > /dev/null
          php -l build/out/request-shield-cache.php > /dev/null
          php -l build/out/request-shield-waf.php > /dev/null

      - name: Composer's autoloader, for the test of a Composer install (StatsExtensionTest)
        # Only the autoloader: the library has no packages to install, and resolving the
        # development tools (PHPStan, Psalm) is not this job's business.
        if: matrix.entry == 'source'
        run: composer dump-autoload --no-dev --no-interaction

      - name: Tests (source tree)
        if: matrix.entry == 'source'
        env:
          # With APCu every test must run; without it the APCu store test is skipped on purpose.
          TESTS_FAIL_ON_SKIP: ${{ matrix.apcu && '1' || '0' }}
          # PHP 8.0.30 (end of life, no more fixes) crashes now and then in the servers the
          # end-to-end tests start (exit 139, a segfault) or answers a demo request late,
          # on GitHub's runners only: on PHP 8.0 a failed run is run once more and the leg
          # fails only when the second run fails too. Every other version fails at once.
          RETRY_ONCE: ${{ matrix.php == '8.0' && '1' || '0' }}
        run: |
          php tests/run.php && exit 0
          [ "$RETRY_ONCE" = 1 ] || exit 1
          echo "::warning::PHP ${{ matrix.php }}: the tests failed, running them once more (PHP 8.0's servers crash now and then on the runners)"
          php tests/run.php

      # Against the built file (0031 E.3). Skips are expected: the demos show the
      # source tree's integration, ShippedTest needs the source tree's Shipped.
      - name: Tests (against the single file)
        # The core: the plugins' tests (RSF06-*, RSF04-03, and those calling needsPlugins())
        # are skipped here -- the core single file has none; the source-tree legs test them.
        if: matrix.entry == 'single'
        env:
          REQUEST_SHIELD_ENTRY: ${{ github.workspace }}/build/out/request-shield.php
          # As in the source-tree step: PHP 8.0 gets one more run after a failure.
          RETRY_ONCE: ${{ matrix.php == '8.0' && '1' || '0' }}
        run: |
          php tests/run.php && exit 0
          [ "$RETRY_ONCE" = 1 ] || exit 1
          echo "::warning::PHP ${{ matrix.php }}, single file: the tests failed, running them once more (PHP 8.0's servers crash now and then on the runners)"
          php tests/run.php

      - name: Cost of a passing request (smoke benchmark)
        if: matrix.entry == 'source'
        run: php -d opcache.file_update_protection=0 bench/overhead.php 20000

  # Shared hosting at its most restrictive (ADR 0013, tier S1): the servers the
  # end-to-end tests start run without APCu, without allow_url_fopen, with the
  # shell functions disabled and 64 MB -- the shield must decide the same.
  minimal-hosting:
    name: PHP 8.0, minimal hosting (S1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: 'pcntl, :apcu'
          ini-values: 'opcache.enable_cli=1, opcache.file_update_protection=0'
          coverage: none
          tools: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ALTCHA's widget for its test (tests/AltchaWidgetTest.php)
        # The npm package as published, pinned and unpacked (npm pack runs no scripts): the test runs
        # the widget's own code against the shield's task. Not a dependency of the library.
        run: |
          cd "$RUNNER_TEMP"
          npm pack altcha@3.3.0 --silent
          tar xzf altcha-3.3.0.tgz
          echo "ALTCHA_WIDGET=$RUNNER_TEMP/package" >> "$GITHUB_ENV"

      - name: Tests, the servers restricted
        env:
          TESTS_HOSTING: minimal
        run: php tests/run.php

  # Nightly and by hand: two builds of every edition, byte for byte the same
  # (proposal 0002: the release builds twice and compares, too).
  determinism:
    name: The single file, built twice, is the same
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Build each edition twice and compare
        run: |
          for edition in mini stats; do
            php build/single-file.php --edition=$edition --out=/tmp/a-$edition.php --build=ci
            php build/single-file.php --edition=$edition --out=/tmp/b-$edition.php --build=ci
            cmp /tmp/a-$edition.php /tmp/b-$edition.php
          done

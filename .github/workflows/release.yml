name: Release

# A tag vX.Y.Z on main becomes a GitHub release with the single files
# (0031 step E.5, proposal 0002): checked, built twice and compared, the
# suite run against the built file, checksums, a build provenance
# attestation. The minisign signature (request-shield.php.minisig,
# SHA256SUMS.minisig) comes with the release key in step E.8.
#
# The repository settings this relies on (the owner's, not this file's):
# an environment "release" with a required reviewer, and a tag ruleset
# that lets only maintainers create v* tags.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Check, build twice, test against the file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the tag must be on main: needs the history

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'apcu, pcntl'
          ini-values: 'apc.enable_cli=1, opcache.enable_cli=1, opcache.file_update_protection=0'
          coverage: none
          tools: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: The tag is on main; the version and the changelog name it
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag $GITHUB_REF_NAME is not on main"; exit 1; }
          php build/release-check.php "$GITHUB_REF_NAME" --notes=notes.md

      - name: Build every edition twice, byte for byte the same
        run: |
          BUILD="$GITHUB_REF_NAME $(git rev-parse --short HEAD)"
          mkdir -p dist build/out
          for edition in mini stats api cache waf; do
            file=request-shield.php; [ "$edition" = mini ] || file="request-shield-$edition.php"
            php build/single-file.php --edition=$edition --build="$BUILD" --out="dist/$file"
            php build/single-file.php --edition=$edition --build="$BUILD" --out="/tmp/again-$file"
            cmp "dist/$file" "/tmp/again-$file"
            php -l "dist/$file" > /dev/null
            cp "dist/$file" "build/out/$file"      # the suite runs against exactly this file
          done

      - name: The suite against the built file
        env:
          REQUEST_SHIELD_ENTRY: ${{ github.workspace }}/build/out/request-shield.php
        run: php tests/run.php

      - name: Checksums
        run: cd dist && sha256sum request-shield.php request-shield-stats.php request-shield-api.php request-shield-cache.php request-shield-waf.php > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write           # the release and its assets
      id-token: write           # the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: The checksums still match
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/request-shield*.php'

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "request-shield $GITHUB_REF_NAME" --notes-file notes.md \
            dist/request-shield.php dist/request-shield-stats.php dist/request-shield-api.php dist/request-shield-cache.php dist/request-shield-waf.php dist/SHA256SUMS

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                kind:
                  type: "string"
                  description: "deny (keep out, default) or exempt (let in)"
                address:
                  type: "string"
                  description: "an address or a range: 203.0.113.7, 198.51.100.0/24"
                for:
                  type: "string"
                  description: "1h, 1d, 7d (default), 30d, date (with until), good (for good: a note is needed)"
                until:
                  type: "string"
                  description: "with for=date: 2026-10-07 or 2026-10-07T15:30"
                note:
                  type: "string"
                  description: "why: shown in the lists and the live view"
                confirm:
                  type: "boolean"
                  description: "a wide range is meant"
              required:

            schema:
              type: "object"
              properties:
                only:
                  type: "string"
                  description: "the examples of this rule ID only"
                asWritten:
                  type: "boolean"
                  description: "monitor as written, not as enforce"
      responses:
        "200":
          description: "The answer"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "examples"
                      - "pass"
                      - "fail"
                      - "skip"
                      - "results"
                      - "without"
                    properties:
                      examples:
                        type: "integer"
                      pass:
                        type: "integer"
                      fail:
                        type: "integer"
                      skip:
                        type: "integer"
                      results:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "status"
                            - "method"
                            - "url"
                            - "expected"
                            - "got"
                            - "at"
                          properties:
                            status:
                              type: "string"
                              enum:
                                - "pass"
                                - "fail"
                                - "skip"
                            rule:
                              type:
                                - "string"
                                - "null"
                            method:
                              type: "string"
                            url:
                              type: "string"
                            expected:
                              type: "string"
                            got:
                              type: "string"
                            why:
                              type: "string"
                            at:
                              type: "string"
                      without:
                        type: "array"
                        items:
                          type: "string"
                  meta:
                    $ref: "#/components/schemas/Meta"
        default:
          description: "A problem (RFC 9457)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"

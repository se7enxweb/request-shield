components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      description: "request-shield access-token <main.rules> \"*\""
  schemas:
    Meta:
      type: "object"
      required:
        - "version"
        - "generated"
        - "tier"
      properties:
        version:
          type: "string"
        generated:
          type: "string"
        tier:
          type: "string"
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"

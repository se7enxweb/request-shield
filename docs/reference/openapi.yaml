openapi: "3.1.0"
info:
  title: "request-shield"
  version: "0.4.0"
  description: "The shield's data: status, rules, the live view, the lists, the statistics. Guarded like the dashboard: a restrict rule, or Authorization: Bearer <token>."
servers:
  - 
    url: "/rs/api/v1"
security:
  - 
    bearer: []
paths:
  "/status":
    get:
      summary: "The version, the tier, the mode and the rule sets in force -- what request-shield version says."
      tags:
        - "RSF06-05"
      x-role: "reader"
      externalDocs:
        url: "https://github.com/cjw-network/request-shield/blob/main/docs/features/RSF06-05-api.md"
      responses:
        "200":
          description: "The answer"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "version"
                      - "php"
                      - "apcu"
                      - "tier"
                      - "store"
                      - "mode"
                      - "ruleSets"
                      - "sites"
                    properties:
                      version:
                        type: "string"
                      php:
                        type: "string"
                      apcu:
                        type: "boolean"
                      tier:
                        type: "string"
                        enum:
                          - "S0"
                          - "S1"
                          - "S2"
                      store:
                        type: "string"
                      mode:
                        type: "string"
                        enum:
                          - "off"
                          - "monitor"
                          - "enforce"
                          - "strict"
                      ruleSets:
                        type: "object"
                      sites:
                        type: "integer"
                  meta:
                    $ref: "#/components/schemas/Meta"
        default:
          description: "A problem (RFC 9457)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/rules":
    get:
      summary: "Every rule with an ID: where it is written, what it does, its revision, how often it decided."
      tags:
        - "RSF06-01"
      x-role: "admin"
      externalDocs:
        url: "https://github.com/cjw-network/request-shield/blob/main/docs/features/RSF06-01-active-rules-page.md"
      parameters:
        - 
          name: "days"
          in: "query"
          required: false
          description: "the days the counts are of: 1 to 400 (default 7)"
          schema:
            type: "integer"
      responses:
        "200":
          description: "The answer"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "days"
                      - "rules"
                    properties:
                      days:
                        type: "integer"
                      rules:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "id"
                            - "where"
                            - "text"
                            - "builtIn"
                            - "decided"
                          properties:
                            id:
                              type: "string"
                            where:
                              type: "string"
                            text:
                              type:
                                - "string"
                                - "null"
                            revision:
                              type:
                                - "integer"
                                - "null"
                            builtIn:
                              type: "boolean"
                            decided:
                              type:
                                - "integer"
                                - "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        default:
          description: "A problem (RFC 9457)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/trace":
    post:
      summary: "What happens to a request, check by check -- as request-shield trace; nothing is counted."
      tags:
        - "RSF06-01"
      x-role: "admin"
      externalDocs:
        url: "https://github.com/cjw-network/request-shield/blob/main/docs/features/RSF06-01-active-rules-page.md"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                url:
                  type: "string"
                  description: "a full address or a path: https://www.example.org/wp-login.php"
                method:
                  type: "string"
                  description: "GET (default), POST, …"
                ip:
                  type: "string"
                  description: "the visitor's address (default 198.51.100.7)"
                ua:
                  type: "string"
                  description: "the User-Agent"
              required:
                - "url"
      responses:
        "200":
          description: "The answer"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "method"
                      - "url"
                      - "ip"
                      - "steps"
                      - "verdict"
                      - "rule"
                      - "status"
                      - "passes"
                    properties:
                      method:
                        type: "string"
                      url:
                        type: "string"
                      ip:
                        type: "string"
                      steps:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "check"
                            - "key"
                            - "state"
                            - "text"
                            - "rule"
                          properties:
                            check:
                              type: "string"
                            key:
                              type: "string"
                            state:
                              type: "string"
                              enum:
                                - "pass"
                                - "note"
                                - "stop"
                                - "skip"
                            text:
                              type: "string"
                            rule:
                              type:
                                - "string"
                                - "null"
                      verdict:
                        type: "string"
                      rule:
                        type:
                          - "string"
                          - "null"
                      watched:
                        type:
                          - "string"
                          - "null"
                      status:
                        type: "integer"
                      passes:
                        type: "boolean"
                  meta:
                    $ref: "#/components/schemas/Meta"
        default:
          description: "A problem (RFC 9457)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  "/test":
